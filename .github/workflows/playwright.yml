name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start Supabase
      run: supabase start

    - name: Setup environment variables
      run: |
        echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" > .env.local
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> .env.local
        echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> .env.local

    - name: Serve Supabase Edge Functions
      run: |
        supabase functions serve > /tmp/supabase-functions.log 2>&1 &
        for attempt in $(seq 1 60); do
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:54321/functions/v1/start-attempt)
          if [ "$status" = "401" ] || [ "$status" = "400" ]; then exit 0; fi
          sleep 2
        done
        cat /tmp/supabase-functions.log
        exit 1

    - name: Run unit and Supabase integration tests
      run: npm test

      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true
        
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15

    - name: Upload Test Results (Linux Snapshots)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-linux
        path: test-results/
        retention-days: 15
